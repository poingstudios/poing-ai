[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poing-reviewer"
version = "1.0.0"
description = "AI-powered automated code review, triage, and multi-platform dependency updater for game engines and native repositories."
readme = "README.md"
authors = [{ name = "Poing Studios", email = "contact@poingstudios.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]
keywords = [
    "code-review",
    "ai",
    "gemini",
    "godot",
    "unity",
    "unreal",
    "github-actions",
    "triage",
    "dependencies",
    "rag",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/poingstudios/poing-reviewer"
Documentation = "https://github.com/poingstudios/poing-reviewer#readme"
Repository = "https://github.com/poingstudios/poing-reviewer"
Issues = "https://github.com/poingstudios/poing-reviewer/issues"
Changelog = "https://github.com/poingstudios/poing-reviewer/releases"

[project.scripts]
poing-reviewer = "poing_reviewer.cli:main"
prev = "poing_reviewer.cli:main"
prv = "poing_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
