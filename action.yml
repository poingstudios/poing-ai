name: 'Poing Reviewer'
description: 'AI Code Review, Triage, and Multi-Platform Dependency Automation powered by Google Gemini.'
author: 'Poing Studios'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'Operation mode: review, triage, or sync'
    required: false
    default: 'review'
  github-token:
    description: 'GitHub token with pull-requests: write, issues: write, or contents: write'
    required: false
    default: ''
  gemini-api-key:
    description: 'Google Gemini API key'
    required: false
    default: ''
  model:
    description: 'Gemini model name (e.g. gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash)'
    required: false
    default: 'gemini-3.7-flash'
  max-chars:
    description: 'Max characters per batch before splitting the diff'
    required: false
    default: '100000'
  max-batches:
    description: 'Max number of batches to review'
    required: false
    default: '5'
  base-ref:
    description: 'Base git reference branch for diff'
    required: false
    default: ''

outputs:
  has_updates:
    description: 'Whether upstream dependency updates were found (sync mode)'
    value: ${{ steps.runner.outputs.has_updates }}
  summary_table:
    description: 'Markdown summary table of synchronized dependencies (sync mode)'
    value: ${{ steps.runner.outputs.summary_table }}
  pr_body:
    description: 'AI generated PR description body with changelogs and breaking changes (sync mode)'
    value: ${{ steps.runner.outputs.pr_body }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Fetch Base Branch (Review Mode)
      if: inputs.mode == 'review' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      run: |
        BASE="${{ inputs.base-ref || github.event.pull_request.base.ref || 'master' }}"
        git fetch origin "$BASE" || true
      shell: bash

    - name: Run Poing Reviewer
      id: runner
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        MODEL_NAME: ${{ inputs.model }}
        MAX_CHARS: ${{ inputs.max-chars }}
        MAX_BATCHES: ${{ inputs.max-batches }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.ref || 'master' }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        ISSUE_ACTION: ${{ github.event.action }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        TRIGGER_ACTION: ${{ github.event.action }}
      run: python ${{ github.action_path }}/poing_reviewer.py
      shell: bash
