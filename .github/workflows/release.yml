name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  auto-release:
    name: Check SemVer, Release & Publish Docker Package
    runs-on: ubuntu-latest
    steps:
      - name: 1. Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: 2. Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 3. Extract Version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted SemVer version: $VERSION"

      - name: 4. Check if Tag Already Exists
        id: check-tag
        run: |
          TAG="${{ steps.get-version.outputs.TAG_NAME }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist. Proceeding with release creation."
          fi

      - name: 5. Create GitHub Release & Update Major Tag
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get-version.outputs.TAG_NAME }}
          VERSION: ${{ steps.get-version.outputs.VERSION }}
        run: |
          # 1. Create GitHub Release with auto-generated notes
          gh release create "$TAG" \
            --title "$TAG — Poing AI Release" \
            --generate-notes \
            --target master

          # 2. Update floating major tag (e.g. v1) so users can pin @v1
          MAJOR_TAG="v$(echo $VERSION | cut -d. -f1)"
          git config user.name "poing-ai[bot]"
          git config user.email "296332247+poing-ai[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG pointer to $TAG"
          git push -f origin "$MAJOR_TAG"

      - name: 6. Log in to GitHub Container Registry (GHCR)
        if: steps.check-tag.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Set up Docker Buildx
        if: steps.check-tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 8. Build & Push Docker Image to GitHub Packages
        if: steps.check-tag.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/poingstudios/poing-ai:latest
            ghcr.io/poingstudios/poing-ai:${{ steps.get-version.outputs.TAG_NAME }}
